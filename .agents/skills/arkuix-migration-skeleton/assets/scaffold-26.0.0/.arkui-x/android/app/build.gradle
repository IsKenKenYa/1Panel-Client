plugins {
    id 'com.android.application'
}

android {
    compileSdkVersion 33
    buildToolsVersion "30.0.3"


    //Select whether you want to execute the compile arkts script.
    def configBuildFlag = false

    task ArkTSBuildTask {
      preBuild.dependsOn ArkTSBuildTask
      doLast {
        if (configBuildFlag) {
          def os = System.getProperty("os.name").toLowerCase()
          if (os.contains("win")) {
            exec {
              commandLine 'cmd', '/c', '.\\buildArkTS'
              workingDir file( project.projectDir.getAbsolutePath() + '\\..' )
            }
          } else {
            exec {
              commandLine 'sh', '-c', 'chmod +x ./buildArkTS && ./buildArkTS'
              workingDir file( project.projectDir.getAbsolutePath() + '/..' )
            }
          }
        }
      }
    }

    defaultConfig {
        applicationId "com.example.arkuixapp"
        minSdkVersion 26
        targetSdkVersion 33
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "android.support.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            signingConfig signingConfigs.debug
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        profile {
            signingConfig signingConfigs.debug
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    dynamicFeatures = []

    sourceSets {
        main {
            jniLibs.srcDirs = ['libs']
        }
    }

    packagingOptions {
        jniLibs {
            useLegacyPackaging true
        }
    }
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar', '*.aar'])
    testImplementation 'junit:junit:4.+'
    androidTestImplementation 'com.android.support.test:runner:1.0.2'
    androidTestImplementation 'com.android.support.test.espresso:espresso-core:3.0.2'
}
