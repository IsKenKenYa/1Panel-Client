<!DOCTYPE html>
<html lang="zh-CN" data-type="software">
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="在浏览器中管理你的 1Panel，配置与加密凭据保存在当前设备。">
  <meta name="theme-color" content="#095868">
  <meta name="referrer" content="no-referrer">
  <meta name="page-type" content="software">
  <meta name="site-kind" content="software">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="1Panel Client">
  <link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>1Panel Client</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="bootstrap.css">
</head>
<body>
  <div id="loading" role="status" aria-live="polite">
    <img src="icons/Icon-192.png" width="64" height="64" alt="">
    <p>正在打开 1Panel Client…</p>
    <p id="loading-error" hidden>应用无法加载，请检查网络后重新打开网页。</p>
    <button id="reload" type="button" hidden>重新加载</button>
  </div>
  <noscript>1Panel Client 需要启用 JavaScript。配置与凭据保存在你的浏览器中。</noscript>
  <script src="vendor/passkeys.bundle.js" defer></script>
  <script src="platform_bootstrap.js" defer></script>
  <script src="flutter_bootstrap.js" defer></script>
</body>
</html>
