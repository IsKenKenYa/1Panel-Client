name: iOS Build

on:
  push:
    branches:
      - dev-v2
    paths:
      - "ios/**"
      - ".github/workflows/ios-build.yml"
  pull_request:
    branches:
      - dev-v2
    paths:
      - "ios/**"
      - ".github/workflows/ios-build.yml"
  workflow_dispatch:

concurrency:
  group: ios-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build iOS
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.x"
          channel: stable
          cache: true

      - name: Cache Pub
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            .dart_tool
          key: pub-${{ runner.os }}-${{ hashFiles('pubspec.lock') }}
          restore-keys: |
            pub-${{ runner.os }}-

      - name: Flutter Pub Get
        run: flutter pub get

      - name: CocoaPods Install
        run: pod install --project-directory=ios

      # 只编译不绑定具体模拟器型号：机型名称随 Xcode 版本变化，
      # 写死会在找不到该设备时直接退出。需要跑 UI 测试时才指定设备。
      - name: Build iOS
        run: |
          xcodebuild -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            build
